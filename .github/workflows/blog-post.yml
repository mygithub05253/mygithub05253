name: Latest Blog Posts

# 계정 이관 기간 중 자동 실행을 차단하고 수동 실행 전용으로 둔다.
# 자동 갱신을 되살리려면 아래 주석 처리된 두 트리거를 해제하면 된다.
on:
  workflow_dispatch:
  # schedule:
  #   # 매일 오전 9시 (KST) = 00:00 UTC
  #   - cron: "0 0 * * *"
  # # content-hub 발행 파이프라인이 CONTENT_DISPATCH_TOKEN으로 보내는 즉시 갱신 신호
  # repository_dispatch:
  #   types: [content-updated]

# README 커밋 push에 필요 (기본 GITHUB_TOKEN이 read-only라 403 발생)
permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with Latest Blog Posts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest Velog posts
        # 공급망 리스크 차단을 위해 가변 태그(v1) 대신 커밋 SHA로 고정한다.
        # 이 SHA는 v1 == v1.9.6 (2026-04-16) 시점의 커밋이다.
        # 버전을 올릴 때는 새 태그가 가리키는 커밋 SHA로 직접 교체할 것.
        uses: gautamkrishnar/blog-post-workflow@2786e54a01b71aec80a5118c2bd6b5044e842597
        with:
          feed_list: "https://v2.velog.io/rss/@kik328288"
          max_post_count: 5
          readme_path: ./README.md
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: "chore: update latest blog posts"
          committer_username: "github-actions[bot]"
          committer_email: "github-actions[bot]@users.noreply.github.com"
